<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sobhan Hosseinpour. Observability Engineer by day, Cybersecurity Enthusiast always." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040A18"/>
      <stop offset="1" stop-color="#0A1D47"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V40" fill="none" stroke="#5B9DFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 3.2s ease-out forwards; }
      .area { opacity: 0; animation: fade 1.2s ease-out 2.4s forwards; }
      .mark { opacity: 0; animation: fade 0.6s ease-out 2.6s forwards; }
      .ring { transform-origin: 800px 212px; animation: ping 2.4s ease-out 3s infinite; }
      .dot  { animation: blink 2s ease-in-out infinite; }
      @keyframes draw  { to { stroke-dashoffset: 0; } }
      @keyframes fade  { to { opacity: 1; } }
      @keyframes ping  { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
      @keyframes blink { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) {
        .line { animation: none; stroke-dashoffset: 0; }
        .area, .mark { animation: none; opacity: 1; }
        .ring, .dot { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- panel header -->
    <circle class="dot" cx="50" cy="45" r="5" fill="#34D399"/>
    <text class="mono" x="66" y="50" font-size="15" fill="#8FB8FF">up{instance="sobhan", job="observability"} 1</text>
    <text class="mono" x="1150" y="50" font-size="15" fill="#5B7FBF" text-anchor="end">0xBlu3Guy</text>
    <line x1="40" y1="70" x2="1160" y2="70" stroke="#5B9DFF" stroke-opacity="0.18"/>

    <!-- identity -->
    <text class="sans" x="48" y="138" font-size="56" font-weight="700" fill="#EAF2FF" letter-spacing="-1">Sobhan Hosseinpour</text>
    <text class="sans" x="50" y="178" font-size="22" fill="#9CC2FF">Observability Engineer by day, Cybersecurity Enthusiast always.</text>

    <!-- time series -->
    <path class="area" fill="url(#area)" d="M0,270 L60,262 L120,268 L180,255 L240,262 L300,250 L360,258 L420,246 L480,254 L540,248 L600,256 L660,247 L720,253 L770,249 L800,212 L830,251 L880,245 L940,252 L1000,243 L1060,250 L1120,241 L1200,247 L1200,320 L0,320 Z"/>
    <path class="line" pathLength="1" fill="none" stroke="#5B9DFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" d="M0,270 L60,262 L120,268 L180,255 L240,262 L300,250 L360,258 L420,246 L480,254 L540,248 L600,256 L660,247 L720,253 L770,249 L800,212 L830,251 L880,245 L940,252 L1000,243 L1060,250 L1120,241 L1200,247"/>

    <!-- the spike worth investigating -->
    <g class="mark">
      <circle class="ring" cx="800" cy="212" r="6" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="800" cy="212" r="4.5" fill="#F59E0B"/>
      <text class="mono" x="816" y="210" font-size="13" fill="#F5C76B">anomaly? investigate.</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#5B9DFF" stroke-opacity="0.25"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
